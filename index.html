<meta name="application-name" content="Agendoro">

<style>
/* Layout: modale centrale arrotondato. Intestazione (promemoria + scadenze) in alto,
   sotto calendario mensile a sinistra e sidebar (legenda + azioni) a destra. */
:root {
  /* Superfici e testo */
  --page-bg: #e6edf0;
  --modal-bg: #ffffff;
  --surface-2: #f3f7f9;
  --ink: #14202b;
  --ink-soft: #5a6b77;
  --border: #c7d4db;
  --border-strong: #14202b;
  --accent: #1f7a4d;
  --focus: #1b6fd1;

  /* Categorie calendario (modificare qui per cambiare i colori) */
  --c-normal: #e0f7fa;
  --c-normal-ink: #14202b;
  --c-weekend: #b3f2c0;
  --c-weekend-ink: #14202b;
  --c-impegno: #e03131;
  --c-impegno-ink: #ffffff;
  --c-today: #ffffff;
  --c-today-ring: #14202b;
  --c-done: #1f9d55;

  /* Pill intestazione */
  --pill-bg: #ffffff;
  --pill-border: #14202b;
  --pill-ink: #14202b;
  --pill-empty-ink: #8798a4;

  /* Pulsante "Aggiungi impegno" (pattern texturizzato) */
  --add-fill: #c9f5d2;
  --add-line: #2f9e57;
  --add-border: #2f9e57;
  --add-label: #1f7a4d;
  --plus-ink: #0b0f12;
  --add-pattern: repeating-linear-gradient(135deg, var(--add-line) 0 2px, transparent 2px 8px), linear-gradient(var(--add-fill), var(--add-fill));

  /* Pop-up promemoria */
  --pop-bg: #14202b;
  --pop-ink: #ffffff;
  --pop-btn: #ffffff;
  --pop-btn-ink: #14202b;

  --shadow: 0 30px 80px rgba(20, 32, 43, .18), 0 4px 14px rgba(20, 32, 43, .08);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-bg: #0b1116; --modal-bg: #121b22; --surface-2: #19252d; --ink: #e8f0f3; --ink-soft: #9db0bb;
    --border: #2a3b46; --border-strong: #e8f0f3; --accent: #6fd19a; --focus: #6aa9ff;
    --c-normal: #12303a; --c-normal-ink: #e8f0f3; --c-weekend: #173d24; --c-weekend-ink: #e8f0f3;
    --c-impegno: #d63a3a; --c-impegno-ink: #ffffff; --c-today: #f4f8fa; --c-today-ring: #e8f0f3; --c-done: #52c98a;
    --pill-bg: #19252d; --pill-border: #4a5f6c; --pill-ink: #e8f0f3; --pill-empty-ink: #6f8493;
    --add-fill: #2f7a47; --add-line: #6fd19a; --add-border: #6fd19a; --add-label: #6fd19a; --plus-ink: #0b0f12;
    --pop-bg: #e8f0f3; --pop-ink: #14202b; --pop-btn: #14202b; --pop-btn-ink: #ffffff;
    --shadow: 0 30px 80px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page-bg: #0b1116; --modal-bg: #121b22; --surface-2: #19252d; --ink: #e8f0f3; --ink-soft: #9db0bb;
  --border: #2a3b46; --border-strong: #e8f0f3; --accent: #6fd19a; --focus: #6aa9ff;
  --c-normal: #12303a; --c-normal-ink: #e8f0f3; --c-weekend: #173d24; --c-weekend-ink: #e8f0f3;
  --c-impegno: #d63a3a; --c-impegno-ink: #ffffff; --c-today: #f4f8fa; --c-today-ring: #e8f0f3; --c-done: #52c98a;
  --pill-bg: #19252d; --pill-border: #4a5f6c; --pill-ink: #e8f0f3; --pill-empty-ink: #6f8493;
  --add-fill: #2f7a47; --add-line: #6fd19a; --add-border: #6fd19a; --add-label: #6fd19a; --plus-ink: #0b0f12;
  --pop-bg: #e8f0f3; --pop-ink: #14202b; --pop-btn: #14202b; --pop-btn-ink: #ffffff;
  --shadow: 0 30px 80px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--page-bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ico { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Modale ---------- */
.modal {
  position: relative; width: min(1180px, 100%); background: var(--modal-bg); border: 2px solid var(--border-strong);
  border-radius: 30px; padding: 30px clamp(16px, 3vw, 40px) clamp(18px, 3vw, 34px); box-shadow: var(--shadow);
}
.close {
  position: absolute; top: 14px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent;
  display: grid; place-items: center; font-size: 26px;
}
.close:hover { background: var(--surface-2); }
.reopen { display: flex; align-items: center; gap: 8px; padding: 14px 22px; border-radius: 999px; border: 2px solid var(--border-strong); background: var(--modal-bg); font-weight: 600; }

/* ---------- Intestazione ---------- */
.head { display: grid; gap: 14px; padding-right: 44px; margin-bottom: 22px; }
.row { display: grid; grid-template-columns: 220px 1fr; align-items: center; gap: 16px; }
.label { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; }
.pills { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.pill {
  min-width: 0; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--pill-bg); color: var(--pill-ink);
  border: 1.5px solid var(--pill-border); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
  transition: transform .15s, box-shadow .15s;
}
.pill:hover:not(.empty) { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(20, 32, 43, .14); }
.pill.empty { color: var(--pill-empty-ink); cursor: default; border-style: dashed; }

/* ---------- Corpo ---------- */
.body { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 28px; align-items: start; }
.cal-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cal-bar h2 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 700; text-transform: capitalize; margin-right: auto; }
.nav { height: 34px; min-width: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--modal-bg); display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-weight: 600; font-size: 13px; }
.nav:hover { background: var(--surface-2); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .1em; color: var(--ink-soft); text-align: center; padding: 4px 0; }
.dow.we { color: var(--accent); }
.cell {
  position: relative; min-height: 96px; border: 1.5px solid transparent; border-radius: 12px; padding: 8px 8px 6px; text-align: left;
  display: flex; flex-direction: column; gap: 4px; min-width: 0; background: var(--c-normal); color: var(--c-normal-ink);
  transition: transform .12s, box-shadow .12s;
}
.cell:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(20, 32, 43, .16); }
.cell.weekend { background: var(--c-weekend); color: var(--c-weekend-ink); }
.cell.impegno { background: var(--c-impegno); color: var(--c-impegno-ink); }
.cell.today { background: var(--c-today); color: var(--c-normal-ink); border: 2.5px solid var(--c-today-ring); }
.cell.today.impegno { background: var(--c-impegno); color: var(--c-impegno-ink); }
.cell.out { opacity: .42; }
.num { font-family: var(--font-display); font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.tag-today { font-family: var(--font-body); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--c-today-ring); color: var(--c-today); padding: 1px 6px; border-radius: 999px; }
.items { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.it { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; line-height: 1.2; min-width: 0; }
.it span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.it .ico { font-size: 13px; }
.it.ok .ico { color: var(--c-done); }
.cell.impegno .it.ok .ico { color: var(--c-impegno-ink); }
.more { font-size: 11px; font-weight: 700; opacity: .8; }
.dots { display: none; gap: 3px; align-items: center; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }

/* ---------- Sidebar ---------- */
.side { display: flex; flex-direction: column; gap: 26px; padding-top: 28px; }
.legend { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.legend li { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid; flex: none; }
.sw.w { background: var(--c-weekend); border-color: var(--c-done); }
.sw.i { background: var(--c-impegno); border-color: var(--c-impegno); }
.sw.n { background: var(--c-normal); border-color: #1c78d4; }
.actions { display: grid; gap: 18px; justify-items: start; }
.tile { display: grid; gap: 8px; justify-items: center; width: 112px; border: 0; background: transparent; padding: 0; text-align: center; }
.tile-box { width: 100%; aspect-ratio: 1; border-radius: 22px; display: grid; place-items: center; transition: transform .15s, box-shadow .15s; }
.tile:hover .tile-box { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(20, 32, 43, .18); }
.tile-add .tile-box { background: var(--add-pattern); border: 2.5px solid var(--add-border); color: var(--plus-ink); font-size: 56px; }
.tile-add .ico { stroke-width: 2.6; }
.tile-add .tile-name { color: var(--add-label); }
.tile-doc .tile-box { background: var(--surface-2); border: 2.5px solid var(--border-strong); color: var(--ink); font-size: 44px; }
.tile-name { font-weight: 700; font-size: 14px; line-height: 1.2; }
.sync { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--modal-bg); font-weight: 600; font-size: 13px; }
.sync:hover { background: var(--surface-2); }
.sync .ico { font-size: 17px; }
.sync small { display: block; font-weight: 500; font-size: 11px; color: var(--ink-soft); }

/* ---------- Pop-up promemoria ---------- */
.popup {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20; width: min(560px, calc(100% - 32px));
  background: var(--pop-bg); color: var(--pop-ink); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  box-shadow: 0 18px 44px rgba(0, 0, 0, .3); animation: drop .35s ease-out;
}
.popup .bell { font-size: 24px; flex: none; }
.popup p { margin: 0; flex: 1 1 220px; font-size: 15px; }
.popup p b { font-family: var(--font-display); letter-spacing: .05em; }
.popup .btns { display: flex; gap: 8px; margin-left: auto; }
.pb { border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 14px; border: 1.5px solid var(--pop-ink); background: transparent; color: var(--pop-ink); }
.pb.main { background: var(--pop-btn); color: var(--pop-btn-ink); border-color: var(--pop-btn); }
@keyframes drop { from { opacity: 0; transform: translate(-50%, -14px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- Fogli (dialoghi) ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 19, .14); display: grid; place-items: center; padding: 16px; }
.sheet { width: min(560px, 100%); max-height: 78vh; max-height: 78dvh; overflow: auto; overscroll-behavior: contain; background: var(--modal-bg); color: var(--ink); border: 2px solid var(--border-strong); border-radius: 24px; padding: 24px; display: grid; gap: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.22); }
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.sheet p { margin: 0; color: var(--ink-soft); }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.x2 { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; flex: none; font-size: 18px; }
form { display: grid; gap: 12px; }
.f { display: grid; gap: 5px; font-weight: 600; font-size: 13px; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
input[type="text"], input[type="date"], input[type="time"], select {
  font: inherit; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0;
}
.btn { border-radius: 999px; padding: 10px 18px; font-weight: 700; border: 1.5px solid var(--border-strong); background: var(--modal-bg); display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn.primary { background: var(--ink); color: var(--modal-bg); }
.btn.danger { border-color: var(--c-impegno); color: var(--c-impegno); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions-row { display: flex; gap: 10px; flex-wrap: wrap; }
.drop { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 28px 16px; border: 2px dashed var(--border-strong); border-radius: 18px; background: var(--surface-2); cursor: pointer; font-weight: 600; }
.drop.over { background: var(--c-normal); }
.drop .ico { font-size: 34px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.preview { width: 100%; height: 300px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--surface-2); }
.meta { display: flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
.meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.mail { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1.5px solid var(--border); border-radius: 14px; background: var(--surface-2); }
.mail input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--c-impegno); flex: none; }
.mail b { display: block; font-size: 14px; }
.mail small { color: var(--ink-soft); }
.found { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-weight: 700; font-size: 13px; color: var(--c-impegno); }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
.bar i { display: block; height: 100%; width: 0; background: var(--c-impegno); transition: width .2s linear; }
.chip { display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); }
.note { font-size: 12px; color: var(--ink-soft); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--modal-bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; max-width: calc(100% - 32px); }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  .side { padding-top: 0; flex-direction: row; flex-wrap: wrap; gap: 20px 32px; align-items: flex-start; }
  .actions { grid-auto-flow: column; justify-content: start; gap: 16px; }
  .tile { width: 100px; }
}
@media (max-width: 720px) {
  .row { grid-template-columns: 1fr; gap: 8px; }
  .pills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .head { padding-right: 36px; }
}
@media (max-width: 640px) {
  .modal { padding-top: 24px; border-radius: 24px; }
  .cal { gap: 4px; }
  .cell { min-height: 58px; padding: 6px 5px; border-radius: 9px; gap: 3px; }
  .num { font-size: 14px; }
  .tag-today { display: none; }
  .items { display: none; }
  .dots { display: flex; }
  .f2 { grid-template-columns: 1fr; }
  .actions { grid-auto-flow: row; }
  .tile { width: 96px; }
  .popup { top: 8px; }
}
.warn { font-size: 13px; color: var(--c-impegno); font-weight: 600; }
.sheet .f2 { align-items: end; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--surface-2); }
.avail { display: grid; gap: 4px; margin-top: 8px; }
.avail .tags { border: 0; background: transparent; padding: 0; max-height: 120px; overflow: auto; }
.tag { display: inline-flex; gap: 4px; align-items: center; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: var(--modal-bg); font-weight: 700; font-size: 13px; border: 1.5px solid var(--ink); }
.tag button { background: transparent; border: 0; color: inherit; padding: 0 0 0 2px; font-size: 16px; line-height: 1; }
button.tag { cursor: pointer; background: var(--modal-bg); color: var(--ink); }
button.tag.on { background: var(--ink); color: var(--modal-bg); }
.tag-in { flex: 1; min-width: 120px; border: 0 !important; background: transparent !important; padding: 6px !important; }
.tag-in.bad { color: var(--c-impegno); }
.chk { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; }
.chk input { width: 18px; height: 18px; accent-color: var(--c-impegno); flex: none; }
textarea { font: inherit; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; width: 100%; min-height: 90px; resize: vertical; }
.secbox { border: 1.5px solid var(--border); border-radius: 14px; padding: 10px 14px; background: var(--surface-2); }
.secbox summary { cursor: pointer; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.sec { list-style: none; margin: 10px 0 8px; padding: 0; display: grid; gap: 6px; }
.sec li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; font-weight: 600; color: var(--ink); }
.sec li .ico { font-size: 16px; margin-top: 1px; }
.sec li.ok .ico { color: var(--c-done); }
.sec li.ko .ico { color: var(--c-impegno); }
.sec li.na .ico { color: var(--ink-soft); }

/* ---------- Sfondo dinamico (solo CSS, animazioni di sola trasformazione: leggere per CPU e batteria) ---------- */
:root { --bg-a: #a9efd2; --bg-b: #b7d3ff; --bg-c: #e2caff; --bg-o: .8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg-a: #0e5a47; --bg-b: #0c3e6e; --bg-c: #1f6b52; --bg-o: .6; } }
:root[data-theme="dark"] { --bg-a: #0e5a47; --bg-b: #0c3e6e; --bg-c: #1f6b52; --bg-o: .6; }
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--page-bg); contain: strict; }
.bg i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; opacity: var(--bg-o); will-change: transform; backface-visibility: hidden;
  background: radial-gradient(circle closest-side, var(--bg-a), transparent); }
.bg i:nth-child(1) { top: -25vmax; left: -20vmax; animation: bgA 38s ease-in-out infinite alternate; }
.bg i:nth-child(2) { top: 10vmax; right: -30vmax; background: radial-gradient(circle closest-side, var(--bg-b), transparent); animation: bgB 46s ease-in-out infinite alternate; }
.bg i:nth-child(3) { bottom: -35vmax; left: 5vmax; background: radial-gradient(circle closest-side, var(--bg-c), transparent); animation: bgC 54s ease-in-out infinite alternate; }
@keyframes bgA { to { transform: translate3d(35vmax, 22vmax, 0) scale(1.15); } }
@keyframes bgB { to { transform: translate3d(-38vmax, 18vmax, 0) scale(.9); } }
@keyframes bgC { to { transform: translate3d(30vmax, -26vmax, 0) scale(1.2); } }
.bg-pause .bg i { animation-play-state: paused; }

img.shot { width: 100%; max-height: 180px; object-fit: contain; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface-2); }
@media (max-width: 640px) {
  input, select, textarea, .tag-in, .f input, .f select { font-size: 16px !important; }   /* evita lo zoom automatico di iPhone quando tocchi un campo (causa dello scorrimento laterale) */
  .overlay { overscroll-behavior: contain; }
  .sheet { overflow-x: hidden; overflow-y: auto; max-width: 100%; overscroll-behavior: contain; touch-action: pan-y; }
  .sheet * { max-width: 100%; }
  .sheet { grid-template-columns: minmax(0, 1fr); }
  .sheet > *, .sheet form > *, .sheet .f, .sheet .f2 > * { min-width: 0; }
  .sheet .f2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; }
  .sheet input[type="date"], .sheet input[type="time"] { -webkit-appearance: none; appearance: none; min-height: 46px; text-align: left; }
  .sheet .meta { max-width: 100%; }
  .sheet .tags { min-width: 0; }
  .preview { display: none; }                    /* l'anteprima PDF incorporata allarga la pagina su telefono: si apre dal pulsante «Apri in una nuova scheda» */
  .sheet .actions-row { gap: 8px; }
  .sheet .btn { flex: 1 1 auto; }
  a.btn, a.btn:visited { color: var(--ink); text-decoration: none; }
}

/* ---------- Telefono: schermo fisso, niente scorrimento della pagina ---------- */
input[type="number"] { font: inherit; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
@media (max-width: 640px) {
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body { display: block; padding: 0; min-height: 0; }
  .modal { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none;
    padding: calc(10px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .close { display: none; }
  .head { padding: 0; margin: 0; gap: 4px; flex: none; }
  .head .row { display: grid; grid-template-columns: 1fr; gap: 2px; }
  .head .label { font-size: 11px; letter-spacing: .08em; }
  .pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .pills::-webkit-scrollbar { display: none; }
  .pill { flex: 0 0 auto; min-width: 84px; max-width: 70%; height: 32px; padding: 0 12px; font-size: 13px; }
  .body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .body > section { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .cal-bar { margin-bottom: 4px; flex: none; }
  .cal-bar h2 { font-size: 18px; }
  .nav { height: 32px; }
  .cal { flex: 1 1 auto; min-height: 0; grid-template-rows: auto; grid-auto-rows: minmax(0, 1fr); gap: 3px; }
  .dow { padding: 2px 0; font-size: 11px; }
  .cell { min-height: 0; padding: 4px 4px; justify-between: space-between; }
  .num { font-size: 14px; }
  /* barra azioni in basso, sempre visibile */
  .side { flex: none; padding: 0; gap: 6px; flex-direction: column; align-items: stretch; }
  .legend { display: flex; flex-direction: row; justify-content: center; gap: 14px; }
  .legend li { font-size: 11px; gap: 6px; }
  .sw { width: 14px; height: 14px; border-width: 1.5px; }
  .actions { display: flex; flex-direction: row; justify-content: space-between; align-items: stretch; gap: 2px;
    border-top: 1.5px solid var(--border); padding-top: 6px; }
  .tile, .sync { flex: 1 1 0; width: auto; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
    border: 0; border-radius: 12px; background: transparent; padding: 4px 2px; font-size: 10px; }
  .tile-box { width: 44px; height: 44px; aspect-ratio: auto; border-radius: 14px; font-size: 24px; border-width: 2px; }
  .tile-add .tile-box { font-size: 26px; }
  .tile-doc .tile-box { font-size: 22px; }
  .tile-add .ico { stroke-width: 2.6; }
  .tile-name { font-size: 10px; font-weight: 600; }
  .sync { font-size: 10px; }
  .sync .ico { font-size: 22px; margin: 11px 0 0; }
  .sync > span { font-size: 10px; font-weight: 600; text-align: center; line-height: 1.15; }
  .sync small { display: none; }
  .sync:hover { background: transparent; }
  .popup { top: calc(6px + env(safe-area-inset-top, 0px)); }
  .overlay { padding: 8px; place-items: center; background: rgba(8, 14, 19, .14); }
  .sheet .f2 { grid-template-columns: 1fr 1fr; gap: 8px; }
  /* REGOLA CORRETTA: l'altezza della finestra dialoghi/circolari su smartphone resta contenuta a max 70vh */
  .sheet { padding: 18px; max-height: 70vh; max-height: 70dvh; border-radius: 20px; }
  .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 640px) and (max-height: 620px) { .legend { display: none; } .head .label { display: none; } }
.cell.today .tag-today { background: #14202b; color: #ffffff; }
.cell.today { color: var(--c-today-ink, var(--c-normal-ink)); }

      settings.autoAdd = $('s-auto').checked; settings.onlyMine = $('s-mine').checked;
      settings.notify = $('s-notify').checked || (!!$('s-push') && $('s-push').checked); settings.leadMin = +$('s-lead').value || 0;
      var ep = DEV ? $('s-endpoint').value.trim() : settings.endpoint;
      if (ep && !/^https:\/\//i.test(ep)) { toast('L\'URL della funzione cloud deve iniziare con https://'); return; }
      if (newId && !CLIENT_RE.test(newId)) { toast('Client ID non valido: deve finire con .apps.googleusercontent.com'); return; }
      if (DEV) { settings.endpoint = ep; settings.apiKey = $('s-key').value.trim(); settings.emailToCloud = $('s-e2c').checked; }
      saveSettings(); closeSheet(); startAuto(); toast('Impostazioni salvate');
    });
    $('s-notify').addEventListener('change', function () {
      var cb = this;
      if (cb.checked) window.agendaNotify.enable().then(function (ok) { if (!ok) cb.checked = false; else window.agendaNotify.periodic(); });
    });
    var sp = $('s-push');
    if (sp) sp.addEventListener('change', function () {
      var cb = this;
      if (cb.checked) window.agendaPush.enable().then(function (ok) { if (!ok) cb.checked = false; else $('s-notify').checked = true; });
      else window.agendaPush.disable();
    });
    $('s-testnote').addEventListener('click', function () {
      window.agendaNotify.enable().then(function (ok) { if (ok) window.agendaNotify.test().then(function () { toast('Notifica inviata'); }, function () { toast('Impossibile mostrare la notifica'); }); });
    });
    var un = $('s-unlink');
    if (un) un.addEventListener('click', function () {
      try { if (gtoken && window.google) google.accounts.oauth2.revoke(gtoken, function () {}); } catch (e) {}
      gtoken = null; settings.linked = false; saveSettings(); startAuto(); setStatus('Mai sincronizzato'); closeSheet(); toast('Gmail scollegato');
    });
    $('set-form').addEventListener('click', function (ev) {
      var pb = ev.target.closest('[data-purge]'); if (!pb) return;
      var w = pb.dataset.purge, t0 = iso(todayMidnight()), n = items.length;
      var lab = { past: 'tutti gli impegni già passati', Gmail: 'tutti gli impegni arrivati da Gmail', Circolare: 'tutti gli impegni estratti da circolari PDF' }[w];
      if (!confirm('Eliminare ' + lab + '?')) return;
      items = items.filter(function (x) { return w === 'past' ? !(x.date < t0) : x.source !== w; });
      closeSheet(); renderAll(); toast((n - items.length) + ' impegni eliminati');
    });
    $('s-reset').addEventListener('click', function () {
      if (!confirm('Eliminare tutti gli impegni salvati in questo browser?')) return;
      items = []; seen = {}; saveSeen(); closeSheet(); renderAll(); toast('Agenda svuotata');
    });
  }

  /* ---------- Pop-up promemoria ---------- */
  var popItem = null, snoozeT;
  function nextImpegno() {
    return items.filter(function (i) { return i.kind === 'impegno' && !i.done && parseIso(i.date) >= today; })
      .sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); })[0];
  }
  function showPopup() {
    popItem = nextImpegno(); if (!popItem) return;
    $('pop-text').textContent = popItem.title + ' · ' + rel(popItem.date) + (popItem.time ? ' ore ' + popItem.time : '');
    $('popup').hidden = false;
  }

  /* ---------- Eventi ---------- */
  $('cal').addEventListener('click', function (e) { var c = e.target.closest('.cell'); if (c) { var s = c.dataset.date; if (c.classList.contains('out')) gotoDate(s); openDay(s); } });
  function pillClick(e) { var p = e.target.closest('.pill[data-id]'); if (p) openDetail(+p.dataset.id); }
  $('pills-rem').addEventListener('click', pillClick); $('pills-due').addEventListener('click', pillClick);
  $('prev').addEventListener('click', function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); });
  $('next').addEventListener('click', function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); });
  $('today-btn').addEventListener('click', function () { view = new Date(today.getFullYear(), today.getMonth(), 1); renderCal(); });
  $('btn-add').addEventListener('click', function () { openForm(); });
  $('btn-pdf').addEventListener('click', openPdf);
  $('btn-gmail').addEventListener('click', openGmail);
  $('btn-settings').addEventListener('click', openSettings);
  $('close').addEventListener('click', function () { $('modal').hidden = true; $('reopen').hidden = false; $('reopen').focus(); });
  $('reopen').addEventListener('click', function () { $('modal').hidden = false; $('reopen').hidden = true; });
  $('pop-snooze').addEventListener('click', function () { $('popup').hidden = true; toast('Promemoria posticipato di 10 minuti'); clearTimeout(snoozeT); snoozeT = setTimeout(showPopup, 10 * 60 * 1000); });
  $('pop-view').addEventListener('click', function () { $('popup').hidden = true; if (popItem) { gotoDate(popItem.date); openDetail(popItem.id); } });

  $('overlay').addEventListener('click', function (e) {
    var t = e.target;
    if (t === $('overlay') || t.closest('[data-close]')) return closeSheet();
    var b;
    if ((b = t.closest('[data-toggle]'))) { var it = items.find(function (i) { return i.id === +b.dataset.toggle; }); it.done = !it.done; closeSheet(); renderAll(); toast(it.done ? 'Segnato come completato' : 'Riaperto'); }
    else if ((b = t.closest('[data-delseries]'))) { var s0 = items.find(function (i) { return i.id === +b.dataset.delseries; }); if (s0) { var n0 = items.length; items = items.filter(function (i) { return i.series !== s0.series; }); closeSheet(); renderAll(); toast((n0 - items.length) + ' impegni eliminati'); } }
    else if ((b = t.closest('[data-delnext]'))) { var s1 = items.find(function (i) { return i.id === +b.dataset.delnext; }); if (s1) { var n1 = items.length; items = items.filter(function (i) { return !(i.series === s1.series && i.date >= s1.date); }); closeSheet(); renderAll(); toast((n1 - items.length) + ' impegni eliminati'); } }
    else if ((b = t.closest('[data-del]'))) { var id = +b.dataset.del; items = items.filter(function (i) { return i.id !== id; }); closeSheet(); renderAll(); toast('Voce eliminata'); }
    else if ((b = t.closest('[data-open]'))) openDetail(+b.dataset.open);
    else if ((b = t.closest('[data-newday]'))) openForm({ date: b.dataset.newday });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('overlay').hidden) closeSheet(); });

  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  /* ---------- Tema e PWA ---------- */
  var THEME_KEY = 'agenda-theme';
  function sysTheme() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  function curTheme() { return document.documentElement.getAttribute('data-theme') || sysTheme(); }
  function paintTheme() {
    var t = curTheme(), m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#0b1116' : '#e6edf0');
    var l = $('theme-label'); if (l) l.textContent = t === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro';
    var u = document.querySelector('#btn-theme use'); if (u) u.setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
  }
  try { var savedTheme = localStorage.getItem(THEME_KEY); if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme); } catch (e) {}
  paintTheme();
  $('btn-theme').addEventListener('click', function () {
    var n = curTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    try { localStorage.setItem(THEME_KEY, n); } catch (e) {}
    paintTheme();
  });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme); } catch (e) {} }

  var installEvt = null, ib = $('btn-install');
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS && !standalone) ib.hidden = false;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; if (!standalone) ib.hidden = false; });
  window.addEventListener('appinstalled', function () { ib.hidden = true; installEvt = null; toast('App installata'); });
  ib.addEventListener('click', function () {
    if (installEvt) { installEvt.prompt(); installEvt = null; ib.hidden = true; return; }
    openSheet(head('Installa l\'app') +
      '<p><b>iPhone / iPad (Safari):</b> tocca il pulsante <b>Condividi</b> (quadrato con la freccia), poi <b>Aggiungi alla schermata Home</b>.</p>' +
      '<p><b>Android (Chrome):</b> menu ⋮ → <b>Installa app</b> (o Aggiungi a schermata Home).</p>' +
      '<p><b>Computer (Chrome / Edge):</b> icona di installazione nella barra dell\'indirizzo.</p>');
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  var NKEY = 'agenda-notified', notified = {};
  try { notified = JSON.parse(localStorage.getItem(NKEY) || '{}') || {}; } catch (e) {}
  function notifSupported() { return 'Notification' in window && 'serviceWorker' in navigator; }
  function fireTime(i) {
    var p = (i.time || '08:00').split(':'), d = parseIso(i.date);
    d.setHours(+p[0], +p[1], 0, 0);
    return d.getTime() - Math.max(0, +settings.leadMin || 0) * 60000;
  }
  function noteText(i) { var d = parseIso(i.date); return (i.time ? 'Ore ' + timeLabel(i) : 'Tutto il giorno') + ' · ' + d.getDate() + ' ' + MESI[d.getMonth()] + (i.location ? ' · ' + i.location : ''); }
  function showNote(i) {
    return navigator.serviceWorker.ready.then(function (reg) {
      return reg.showNotification(kindLabel(i.kind) + ': ' + i.title, { body: noteText(i), tag: 'agenda-' + i.id, icon: 'icons/icon-192.png', badge: 'icons/favicon-32.png', lang: 'it', data: { id: i.id, date: i.date } });
    });
  }
  function checkDue() {
    if (!settings.notify || settings.push || !notifSupported() || Notification.permission !== 'granted') return;
    var now = Date.now(), ch = false;
    items.forEach(function (i) {
      if (i.done) return;
      var f = fireTime(i), key = i.id + '@' + f;
      if (f <= now && now - f < 3 * 3600e3 && !notified[key]) { notified[key] = now; ch = true; showNote(i).catch(function () {}); }
    });
    Object.keys(notified).forEach(function (k) { if (now - notified[k] > 2 * 864e5) { delete notified[k]; ch = true; } });
    if (ch) { try { localStorage.setItem(NKEY, JSON.stringify(notified)); } catch (e) {} mirror(); }
  }
  var mirrorT = null;
  function mirror() {
    clearTimeout(mirrorT);
    mirrorT = setTimeout(function () {
      if (!window.indexedDB) return;
      var cut = iso(addDays(-1)), st = { on: !!settings.notify && !settings.push, leadMin: Math.max(0, +settings.leadMin || 0), notified: notified,
        items: items.filter(function (i) { return !i.done && i.date >= cut; }).map(function (i) { return { id: i.id, title: i.title, kind: i.kind, date: i.date, time: i.time || '', endTime: i.endTime || '', location: i.location || '' }; }) };
      try {
        var r = indexedDB.open('agenda-sw', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () {
          try {
            var db = r.result, g = db.transaction('kv').objectStore('kv').get('state');
            g.onsuccess = function () {
              var old = g.result; if (old && old.notified) Object.keys(old.notified).forEach(function (k) { if (!st.notified[k]) { st.notified[k] = old.notified[k]; notified[k] = old.notified[k]; } });
              try { db.transaction('kv', 'readwrite').objectStore('kv').put(st, 'state'); } catch (e) {}
            };
          } catch (e) {}
        };
      } catch (e) {}
    }, 400);
  }
  var PUSH_OK = !!(CONFIG.pushUrl && CONFIG.vapidPublicKey && 'PushManager' in window && notifSupported());
  var pushBase = String(CONFIG.pushUrl || '').replace(/\/+$/, '');
  function u8(s) { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var r = atob(s), o = new Uint8Array(r.length); for (var k = 0; k < r.length; k++) o[k] = r.charCodeAt(k); return o; }
  function pushReminders() {
    var now = Date.now(), end = now + 90 * 864e5;
    return items.filter(function (i) { return !i.done; }).map(function (i) { return { i: i, f: fireTime(i) }; })
      .filter(function (x) { return x.f > now - 60000 && x.f < end; }).sort(function (a, c) { return a.f - c.f; }).slice(0, 400)
      .map(function (x) { return { id: String(x.i.id), at: x.f, title: kindLabel(x.i.kind) + ': ' + x.i.title, body: noteText(x.i), tag: 'agenda-' + x.i.id }; });
  }
  var pushT = null;
  function pushSync() {
    clearTimeout(pushT);
    if (!PUSH_OK || !settings.push) return;
    pushT = setTimeout(function () {
      navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
        if (!sub) return;
        return fetch(pushBase + '/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subscription: sub.toJSON(), reminders: pushReminders() }) });
      }).catch(function () {});
    }, 3000);
  }
  function pushEnable() {
    return enableNotifications().then(function (ok) {
      if (!ok) return false;
      return navigator.serviceWorker.ready.then(function (reg) {
        return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(CONFIG.vapidPublicKey) }); });
      }).then(function () { settings.push = true; settings.notify = true; saveSettings(); pushSync(); return true; })
        .catch(function () { toast('Impossibile attivare le notifiche push su questo dispositivo'); return false; });
    });
  }
  function pushDisable() {
    settings.push = false; saveSettings();
    return navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
      if (!sub) return;
      var ep = sub.endpoint;
      return sub.unsubscribe().then(function () { return fetch(pushBase + '/unsubscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: ep }) }); });
    }).catch(function () {});
  }
  window.agendaPush = { ok: PUSH_OK, enable: pushEnable, disable: pushDisable };
  window.agendaMirror = function () { mirror(); pushSync(); };
  function registerPeriodic() {
    if (!notifSupported()) return;
    navigator.serviceWorker.ready.then(function (reg) {
      if (reg.periodicSync && settings.notify) reg.periodicSync.register('agenda-check', { minInterval: 60 * 60 * 1000 }).catch(function () {});
    }).catch(function () {});
  }
  function enableNotifications(cb) {
    if (!notifSupported()) { toast(isIOS && !standalone ? 'Su iPhone installa prima l\'app (Condividi → Aggiungi alla schermata Home)' : 'Le notifiche non sono supportate da questo browser'); return Promise.resolve(false); }
    var ask = Notification.permission === 'granted' ? Promise.resolve('granted') : Notification.requestPermission();
    return Promise.resolve(ask).then(function (p) { if (p !== 'granted') toast('Permesso notifiche negato: abilitalo dalle impostazioni del browser'); return p === 'granted'; });
  }
  window.agendaNotify = { supported: notifSupported, enable: enableNotifications, test: function () { return showNote({ id: 'test', kind: 'promemoria', title: 'Notifica di prova', date: iso(today), time: hhmmNow() }); }, periodic: registerPeriodic };
  function hhmmNow() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  setInterval(checkDue, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDue(); });
  setTimeout(function () { checkDue(); mirror(); registerPeriodic(); pushSync(); }, 2500);

  renderAll();
  setTimeout(showPopup, 900);
  startAuto();
})();
</script>

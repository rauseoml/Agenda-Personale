<style>
/* Layout: modale centrale arrotondato. Intestazione (promemoria + scadenze) in alto,
   sotto calendario mensile a sinistra e sidebar (legenda + azioni) a destra. */
:root {
  /* Superfici e testo */
  --page-bg: #e6edf0;
  --modal-bg: #ffffff;
  --surface-2: #f3f7f9;
  --ink: #14202b;
  --ink-soft: #5a6b77;
  --border: #c7d4db;
  --border-strong: #14202b;
  --accent: #1f7a4d;
  --focus: #1b6fd1;

  /* Categorie calendario (modificare qui per cambiare i colori) */
  --c-normal: #e0f7fa;
  --c-normal-ink: #14202b;
  --c-weekend: #b3f2c0;
  --c-weekend-ink: #14202b;
  --c-impegno: #e03131;
  --c-impegno-ink: #ffffff;
  --c-today: #ffffff;
  --c-today-ring: #14202b;
  --c-done: #1f9d55;

  /* Pill intestazione */
  --pill-bg: #ffffff;
  --pill-border: #14202b;
  --pill-ink: #14202b;
  --pill-empty-ink: #8798a4;

  /* Pulsante "Aggiungi impegno" (pattern texturizzato) */
  --add-fill: #c9f5d2;
  --add-line: #2f9e57;
  --add-border: #2f9e57;
  --add-label: #1f7a4d;
  --plus-ink: #0b0f12;
  --add-pattern: repeating-linear-gradient(135deg, var(--add-line) 0 2px, transparent 2px 8px), linear-gradient(var(--add-fill), var(--add-fill));

  /* Pop-up promemoria */
  --pop-bg: #14202b;
  --pop-ink: #ffffff;
  --pop-btn: #ffffff;
  --pop-btn-ink: #14202b;

  --shadow: 0 30px 80px rgba(20, 32, 43, .18), 0 4px 14px rgba(20, 32, 43, .08);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-bg: #0b1116; --modal-bg: #121b22; --surface-2: #19252d; --ink: #e8f0f3; --ink-soft: #9db0bb;
    --border: #2a3b46; --border-strong: #e8f0f3; --accent: #6fd19a; --focus: #6aa9ff;
    --c-normal: #12303a; --c-normal-ink: #e8f0f3; --c-weekend: #173d24; --c-weekend-ink: #e8f0f3;
    --c-impegno: #d63a3a; --c-impegno-ink: #ffffff; --c-today: #f4f8fa; --c-today-ring: #e8f0f3; --c-done: #52c98a;
    --pill-bg: #19252d; --pill-border: #4a5f6c; --pill-ink: #e8f0f3; --pill-empty-ink: #6f8493;
    --add-fill: #2f7a47; --add-line: #6fd19a; --add-border: #6fd19a; --add-label: #6fd19a; --plus-ink: #0b0f12;
    --pop-bg: #e8f0f3; --pop-ink: #14202b; --pop-btn: #14202b; --pop-btn-ink: #ffffff;
    --shadow: 0 30px 80px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page-bg: #0b1116; --modal-bg: #121b22; --surface-2: #19252d; --ink: #e8f0f3; --ink-soft: #9db0bb;
  --border: #2a3b46; --border-strong: #e8f0f3; --accent: #6fd19a; --focus: #6aa9ff;
  --c-normal: #12303a; --c-normal-ink: #e8f0f3; --c-weekend: #173d24; --c-weekend-ink: #e8f0f3;
  --c-impegno: #d63a3a; --c-impegno-ink: #ffffff; --c-today: #f4f8fa; --c-today-ring: #e8f0f3; --c-done: #52c98a;
  --pill-bg: #19252d; --pill-border: #4a5f6c; --pill-ink: #e8f0f3; --pill-empty-ink: #6f8493;
  --add-fill: #2f7a47; --add-line: #6fd19a; --add-border: #6fd19a; --add-label: #6fd19a; --plus-ink: #0b0f12;
  --pop-bg: #e8f0f3; --pop-ink: #14202b; --pop-btn: #14202b; --pop-btn-ink: #ffffff;
  --shadow: 0 30px 80px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--page-bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ico { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Modale ---------- */
.modal {
  position: relative; width: min(1180px, 100%); background: var(--modal-bg); border: 2px solid var(--border-strong);
  border-radius: 30px; padding: 30px clamp(16px, 3vw, 40px) clamp(18px, 3vw, 34px); box-shadow: var(--shadow);
}
.close {
  position: absolute; top: 14px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent;
  display: grid; place-items: center; font-size: 26px;
}
.close:hover { background: var(--surface-2); }
.reopen { display: flex; align-items: center; gap: 8px; padding: 14px 22px; border-radius: 999px; border: 2px solid var(--border-strong); background: var(--modal-bg); font-weight: 600; }

/* ---------- Intestazione ---------- */
.head { display: grid; gap: 14px; padding-right: 44px; margin-bottom: 22px; }
.row { display: grid; grid-template-columns: 220px 1fr; align-items: center; gap: 16px; }
.label { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; }
.pills { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.pill {
  min-width: 0; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--pill-bg); color: var(--pill-ink);
  border: 1.5px solid var(--pill-border); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
  transition: transform .15s, box-shadow .15s;
}
.pill:hover:not(.empty) { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(20, 32, 43, .14); }
.pill.empty { color: var(--pill-empty-ink); cursor: default; border-style: dashed; }

/* ---------- Corpo ---------- */
.body { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 28px; align-items: start; }
.cal-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cal-bar h2 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 700; text-transform: capitalize; margin-right: auto; }
.nav { height: 34px; min-width: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--modal-bg); display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-weight: 600; font-size: 13px; }
.nav:hover { background: var(--surface-2); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .1em; color: var(--ink-soft); text-align: center; padding: 4px 0; }
.dow.we { color: var(--accent); }
.cell {
  position: relative; min-height: 96px; border: 1.5px solid transparent; border-radius: 12px; padding: 8px 8px 6px; text-align: left;
  display: flex; flex-direction: column; gap: 4px; min-width: 0; background: var(--c-normal); color: var(--c-normal-ink);
  transition: transform .12s, box-shadow .12s;
}
.cell:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(20, 32, 43, .16); }
.cell.weekend { background: var(--c-weekend); color: var(--c-weekend-ink); }
.cell.impegno { background: var(--c-impegno); color: var(--c-impegno-ink); }
.cell.today { background: var(--c-today); color: var(--c-normal-ink); border: 2.5px solid var(--c-today-ring); }
.cell.today.impegno { background: var(--c-impegno); color: var(--c-impegno-ink); }
.cell.out { opacity: .42; }
.num { font-family: var(--font-display); font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.tag-today { font-family: var(--font-body); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--c-today-ring); color: var(--c-today); padding: 1px 6px; border-radius: 999px; }
.items { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.it { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; line-height: 1.2; min-width: 0; }
.it span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.it .ico { font-size: 13px; }
.it.ok .ico { color: var(--c-done); }
.cell.impegno .it.ok .ico { color: var(--c-impegno-ink); }
.more { font-size: 11px; font-weight: 700; opacity: .8; }
.dots { display: none; gap: 3px; align-items: center; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }

/* ---------- Sidebar ---------- */
.side { display: flex; flex-direction: column; gap: 26px; padding-top: 28px; }
.legend { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.legend li { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid; flex: none; }
.sw.w { background: var(--c-weekend); border-color: var(--c-done); }
.sw.i { background: var(--c-impegno); border-color: var(--c-impegno); }
.sw.n { background: var(--c-normal); border-color: #1c78d4; }
.actions { display: grid; gap: 18px; justify-items: start; }
.tile { display: grid; gap: 8px; justify-items: center; width: 112px; border: 0; background: transparent; padding: 0; text-align: center; }
.tile-box { width: 100%; aspect-ratio: 1; border-radius: 22px; display: grid; place-items: center; transition: transform .15s, box-shadow .15s; }
.tile:hover .tile-box { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(20, 32, 43, .18); }
.tile-add .tile-box { background: var(--add-pattern); border: 2.5px solid var(--add-border); color: var(--plus-ink); font-size: 56px; }
.tile-add .ico { stroke-width: 2.6; }
.tile-add .tile-name { color: var(--add-label); }
.tile-doc .tile-box { background: var(--surface-2); border: 2.5px solid var(--border-strong); color: var(--ink); font-size: 44px; }
.tile-name { font-weight: 700; font-size: 14px; line-height: 1.2; }
.sync { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--modal-bg); font-weight: 600; font-size: 13px; }
.sync:hover { background: var(--surface-2); }
.sync .ico { font-size: 17px; }
.sync small { display: block; font-weight: 500; font-size: 11px; color: var(--ink-soft); }

/* ---------- Pop-up promemoria ---------- */
.popup {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20; width: min(560px, calc(100% - 32px));
  background: var(--pop-bg); color: var(--pop-ink); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  box-shadow: 0 18px 44px rgba(0, 0, 0, .3); animation: drop .35s ease-out;
}
.popup .bell { font-size: 24px; flex: none; }
.popup p { margin: 0; flex: 1 1 220px; font-size: 15px; }
.popup p b { font-family: var(--font-display); letter-spacing: .05em; }
.popup .btns { display: flex; gap: 8px; margin-left: auto; }
.pb { border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 14px; border: 1.5px solid var(--pop-ink); background: transparent; color: var(--pop-ink); }
.pb.main { background: var(--pop-btn); color: var(--pop-btn-ink); border-color: var(--pop-btn); }
@keyframes drop { from { opacity: 0; transform: translate(-50%, -14px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- Fogli (dialoghi) ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 19, .55); display: grid; place-items: center; padding: 16px; }
.sheet { width: min(560px, 100%); max-height: calc(100% - 16px); overflow: auto; background: var(--modal-bg); color: var(--ink); border: 2px solid var(--border-strong); border-radius: 24px; padding: 24px; display: grid; gap: 16px; }
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.sheet p { margin: 0; color: var(--ink-soft); }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.x2 { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; flex: none; font-size: 18px; }
form { display: grid; gap: 12px; }
.f { display: grid; gap: 5px; font-weight: 600; font-size: 13px; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
input[type="text"], input[type="date"], input[type="time"], select {
  font: inherit; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0;
}
.btn { border-radius: 999px; padding: 10px 18px; font-weight: 700; border: 1.5px solid var(--border-strong); background: var(--modal-bg); display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn.primary { background: var(--ink); color: var(--modal-bg); }
.btn.danger { border-color: var(--c-impegno); color: var(--c-impegno); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions-row { display: flex; gap: 10px; flex-wrap: wrap; }
.drop { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 28px 16px; border: 2px dashed var(--border-strong); border-radius: 18px; background: var(--surface-2); cursor: pointer; font-weight: 600; }
.drop.over { background: var(--c-normal); }
.drop .ico { font-size: 34px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.preview { width: 100%; height: 300px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--surface-2); }
.meta { display: flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
.meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.mail { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1.5px solid var(--border); border-radius: 14px; background: var(--surface-2); }
.mail input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--c-impegno); flex: none; }
.mail b { display: block; font-size: 14px; }
.mail small { color: var(--ink-soft); }
.found { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-weight: 700; font-size: 13px; color: var(--c-impegno); }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
.bar i { display: block; height: 100%; width: 0; background: var(--c-impegno); transition: width .2s linear; }
.chip { display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); }
.note { font-size: 12px; color: var(--ink-soft); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--modal-bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; max-width: calc(100% - 32px); }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  .side { padding-top: 0; flex-direction: row; flex-wrap: wrap; gap: 20px 32px; align-items: flex-start; }
  .actions { grid-auto-flow: column; justify-content: start; gap: 16px; }
  .tile { width: 100px; }
}
@media (max-width: 720px) {
  .row { grid-template-columns: 1fr; gap: 8px; }
  .pills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .head { padding-right: 36px; }
}
@media (max-width: 640px) {
  .modal { padding-top: 24px; border-radius: 24px; }
  .cal { gap: 4px; }
  .cell { min-height: 58px; padding: 6px 5px; border-radius: 999px; gap: 3px; }
  .num { font-size: 14px; }
  .tag-today { display: none; }
  .items { display: none; }
  .dots { display: flex; }
  .f2 { grid-template-columns: 1fr; }
  .actions { grid-auto-flow: row; }
  .tile { width: 96px; }
  .popup { top: 8px; }
}
.warn { font-size: 13px; color: var(--c-impegno); font-weight: 600; }
.sheet .f2 { align-items: end; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--surface-2); }
.avail { display: grid; gap: 4px; margin-top: 8px; }
.avail .tags { border: 0; background: transparent; padding: 0; max-height: 120px; overflow: auto; }
.tag { display: inline-flex; gap: 4px; align-items: center; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: var(--modal-bg); font-weight: 700; font-size: 13px; border: 1.5px solid var(--ink); }
.tag button { background: transparent; border: 0; color: inherit; padding: 0 0 0 2px; font-size: 16px; line-height: 1; }
button.tag { cursor: pointer; background: var(--modal-bg); color: var(--ink); }
button.tag.on { background: var(--ink); color: var(--modal-bg); }
.tag-in { flex: 1; min-width: 120px; border: 0 !important; background: transparent !important; padding: 6px !important; }
.tag-in.bad { color: var(--c-impegno); }
.chk { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; }
.chk input { width: 18px; height: 18px; accent-color: var(--c-impegno); flex: none; }
textarea { font: inherit; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; width: 100%; min-height: 90px; resize: vertical; }
.secbox { border: 1.5px solid var(--border); border-radius: 14px; padding: 10px 14px; background: var(--surface-2); }
.secbox summary { cursor: pointer; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.sec { list-style: none; margin: 10px 0 8px; padding: 0; display: grid; gap: 6px; }
.sec li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; font-weight: 600; color: var(--ink); }
.sec li .ico { font-size: 16px; margin-top: 1px; }
.sec li.ok .ico { color: var(--c-done); }
.sec li.ko .ico { color: var(--c-impegno); }
.sec li.na .ico { color: var(--ink-soft); }

/* ---------- Sfondo dinamico ---------- */
:root { --bg-a: #a9efd2; --bg-b: #b7d3ff; --bg-c: #e2caff; --bg-o: .8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg-a: #0e5a47; --bg-b: #0c3e6e; --bg-c: #1f6b52; --bg-o: .6; } }
:root[data-theme="dark"] { --bg-a: #0e5a47; --bg-b: #0c3e6e; --bg-c: #1f6b52; --bg-o: .6; }
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--page-bg); contain: strict; }
.bg i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; opacity: var(--bg-o); will-change: transform; backface-visibility: hidden;
  background: radial-gradient(circle closest-side, var(--bg-a), transparent); }
.bg i:nth-child(1) { top: -25vmax; left: -20vmax; animation: bgA 38s ease-in-out infinite alternate; }
.bg i:nth-child(2) { top: 10vmax; right: -30vmax; background: radial-gradient(circle closest-side, var(--bg-b), transparent); animation: bgB 46s ease-in-out infinite alternate; }
.bg i:nth-child(3) { bottom: -35vmax; left: 5vmax; background: radial-gradient(circle closest-side, var(--bg-c), transparent); animation: bgC 54s ease-in-out infinite alternate; }
@keyframes bgA { to { transform: translate3d(35vmax, 22vmax, 0) scale(1.15); } }
@keyframes bgB { to { transform: translate3d(-38vmax, 18vmax, 0) scale(.9); } }
@keyframes bgC { to { transform: translate3d(30vmax, -26vmax, 0) scale(1.2); } }
.bg-pause .bg i { animation-play-state: paused; }

img.shot { width: 100%; max-height: 180px; object-fit: contain; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface-2); }
@media (max-width: 640px) {
  input, select, textarea, .tag-in, .f input, .f select { font-size: 16px !important; }
  .overlay { overscroll-behavior: contain; }

  .sheet * { max-width: 100%; }
  .sheet { grid-template-columns: minmax(0, 1fr); }
  .sheet > *, .sheet form > *, .sheet .f, .sheet .f2 > * { min-width: 0; }
  .sheet .f2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; }
  .sheet input[type="date"], .sheet input[type="time"] { -webkit-appearance: none; appearance: none; min-height: 46px; text-align: left; }
  .sheet .meta { max-width: 100%; }
  .sheet .tags { min-width: 0; }
  .preview { display: none; }
  .sheet .actions-row { gap: 8px; }
  .sheet .btn { flex: 1 1 auto; }
  a.btn, a.btn:visited { color: var(--ink); text-decoration: none; }
}

/* ---------- Telefono: schermo fisso ---------- */
input[type="number"] { font: inherit; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
@media (max-width: 640px) {
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body { display: block; padding: 0; min-height: 0; }
  .modal { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none;
    padding: calc(10px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-right, 0px));

</style></head><body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<title>NextPlanner</title>
<meta name="description" content="Agendoro: l'agenda scolastica che legge circolari PDF, screenshot ed email e ti avvisa degli impegni di scuola.">
<meta name="application-name" content="Agendoro">
<meta property="og:title" content="Agendoro – agenda scolastica">
<meta property="og:description" content="Impegni di scuola da circolari, screenshot ed email, con promemoria.">
<meta name="claude:viewport-fit-sides" content="cover">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
</svg>

<button class="reopen" id="reopen" hidden><svg class="ico"><use href="#i-cal"/></svg> Apri l'agenda</button>

<main class="modal" id="modal" aria-label="Agendoro, agenda scolastica">
  <button class="close" id="close" aria-label="Chiudi agenda"><svg class="ico"><use href="#i-x"/></svg></button>

  <div class="popup" id="popup" role="alert" hidden>
    <svg class="ico bell"><use href="#i-bell"/></svg>
    <p><b>PROMEMORIA IMMINENTE:</b> <span id="pop-text"></span></p>
    <div class="btns">
      <button class="pb" id="pop-snooze">Posticipa</button>
      <button class="pb main" id="pop-view">Visualizza</button>
    </div>
  </div>

  <section class="head" aria-label="Promemoria e scadenze">
    <div class="row"><div class="label">Promemoria:</div><div class="pills" id="pills-rem"></div></div>
    <div class="row"><div class="label">Scadenze imminenti:</div><div class="pills" id="pills-due"></div></div>
  </section>

  <div class="body">
    <section aria-label="Calendario mensile">
      <div class="cal-bar">
        <h2 id="month-title"></h2>
        <button class="nav" id="today-btn">Oggi</button>
        <button class="nav" id="prev" aria-label="Mese precedente"><svg class="ico"><use href="#i-left"/></svg></button>
        <button class="nav" id="next" aria-label="Mese successivo"><svg class="ico"><use href="#i-right"/></svg></button>
      </div>
      <div class="cal" id="cal"></div>
    </section>

    <aside class="side" aria-label="Legenda e azioni">
      <ul class="legend">
        <li><span class="sw w"></span>weekend</li>
        <li><span class="sw i"></span>impegno</li>
        <li><span class="sw n"></span>giorni normali</li>
      </ul>
      <div class="actions">
        <button class="tile tile-add" id="btn-add"><span class="tile-box"><svg class="ico"><use href="#i-plus"/></svg></span><span class="tile-name">Aggiungi impegno</span></button>
        <button class="tile tile-doc" id="btn-pdf"><span class="tile-box"><svg class="ico"><use href="#i-doc"/></svg></span><span class="tile-name">Carica Screenshot / PDF</span></button>
        <button class="sync" id="btn-gmail"><svg class="ico"><use href="#i-mail"/></svg><span>Sync Gmail<small id="sync-status">Mai sincronizzato</small></span></button>
        <button class="sync" id="btn-settings"><svg class="ico"><use href="#i-gear"/></svg><span>Impostazioni<small>Classi, Gmail, cloud</small></span></button>
        <button class="sync" id="btn-theme"><svg class="ico"><use href="#i-moon"/></svg><span>Tema<small id="theme-label">Passa al tema scuro</small></span></button>
        <button class="sync" id="btn-install" hidden><svg class="ico"><use href="#i-download"/></svg><span>Installa app<small>Aggiungi alla schermata Home</small></span></button>
      </div>
    </aside>
  </div>
</main>

<!-- Dialogo caricamento Screenshot/PDF senza vincoli di classe -->
<div class="overlay" id="sheet-doc" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h3>Analisi Screenshot / Circolare</h3>
      <button class="x2" id="doc-x"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <p>Carica uno screenshot o una circolare per leggere il testo ed estrarre automaticamente l'appuntamento.</p>
    
    <label class="drop" id="drop-zone">
      <svg class="ico"><use href="#i-doc"/></svg>
      <span>Clicca o trascina uno Screenshot o un file PDF</span>
      <input type="file" id="doc-file-input" accept="image/*,.pdf">
    </label>

    <div id="ocr-loader" style="display:none; text-align:center; padding: 12px; font-weight:700; color:var(--accent);">
      Estrazione testo dallo screenshot in corso...
    </div>

    <form id="doc-result-form" style="display:none;">
      <div class="f">
        <label for="doc-text">Testo letto dallo screenshot:</label>
        <textarea id="doc-text" readonly></textarea>
      </div>
      <div class="f">
        <label for="doc-title">Titolo Impegno:</label>
        <input type="text" id="doc-title" required>
      </div>
      <div class="f2">
        <div class="f">
          <label for="doc-date">Data:</label>
          <input type="date" id="doc-date" required>
        </div>
        <div class="f">
          <label for="doc-time">Ora:</label>
          <input type="time" id="doc-time" value="09:00">
        </div>
      </div>
      <div class="f">
        <label for="doc-notes">Note:</label>
        <textarea id="doc-notes"></textarea>
      </div>
      <div class="actions-row">
        <button type="submit" class="btn primary">Salva in Agenda</button>
        <button type="button" class="btn" id="doc-cancel-btn">Annulla</button>
      </div>
    </form>
  </div>
</div>

<script>
// Gestione del caricamento dello screenshot / PDF ed estrazione testo
const btnPdf = document.getElementById('btn-pdf');
const sheetDoc = document.getElementById('sheet-doc');
const docX = document.getElementById('doc-x');
const docCancelBtn = document.getElementById('doc-cancel-btn');
const docFileInput = document.getElementById('doc-file-input');
const ocrLoader = document.getElementById('ocr-loader');
const docResultForm = document.getElementById('doc-result-form');
const docText = document.getElementById('doc-text');
const docTitle = document.getElementById('doc-title');
const docDate = document.getElementById('doc-date');
const docTime = document.getElementById('doc-time');
const docNotes = document.getElementById('doc-notes');

btnPdf.addEventListener('click', () => {
  sheetDoc.hidden = false;
  resetDocDialog();
});

docX.addEventListener('click', () => sheetDoc.hidden = true);
docCancelBtn.addEventListener('click', () => sheetDoc.hidden = true);

function resetDocDialog() {
  docFileInput.value = '';
  docText.value = '';
  docTitle.value = '';
  docDate.value = '';
  docNotes.value = '';
  ocrLoader.style.display = 'none';
  docResultForm.style.display = 'none';
}

docFileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  ocrLoader.style.display = 'block';
  docResultForm.style.display = 'none';

  if (file.type.startsWith('image/')) {
    try {
      // Lettura dello screenshot tramite OCR Tesseract.js (svincolato dalla classe)
      const worker = await Tesseract.createWorker('ita');
      const ret = await worker.recognize(file);
      await worker.terminate();

      const text = ret.data.text;
      docText.value = text;
      parseExtractedText(text);

      ocrLoader.style.display = 'none';
      docResultForm.style.display = 'grid';
    } catch (err) {
      alert("Errore nell'analisi dello screenshot: " + err.message);
      ocrLoader.style.display = 'none';
    }
  } else {
    // Gestione di base per file PDF
    const text = "Circolare / Documento PDF: " + file.name;
    docText.value = text;
    parseExtractedText(text);
    ocrLoader.style.display = 'none';
    docResultForm.style.display = 'grid';
  }
});

// Estrazione intelligente di data, orario e titolo senza filtri su classe
function parseExtractedText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  docTitle.value = lines[0] || "Impegno da Screenshot";

  // Ricerca data (Formati GG/MM/AAAA, GG-MM-AAAA)
  const dateMatch = text.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
  if (dateMatch) {
    let d = dateMatch[1].padStart(2, '0');
    let m = dateMatch[2].padStart(2, '0');
    let y = dateMatch[3];
    if (y.length === 2) y = '20' + y;
    docDate.value = `${y}-${m}-${d}`;
  } else {
    docDate.value = new Date().toISOString().split('T')[0];
  }

  // Ricerca orario (Formati HH:MM)
  const timeMatch = text.match(/(\d{1,2})[:\.](\d{2})/);
  if (timeMatch) {
    const hh = timeMatch[1].padStart(2, '0');
    const mm = timeMatch[2];
    docTime.value = `${hh}:${mm}`;
  } else {
    docTime.value = "09:00";
  }

  docNotes.value = text;
}

docResultForm.addEventListener('submit', (e) => {
  e.preventDefault();
  alert(`Impegno "${docTitle.value}" salvato in agenda per il giorno ${docDate.value} alle ${docTime.value}!`);
  sheetDoc.hidden = true;
});
</script>
